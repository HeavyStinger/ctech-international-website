    lg: { padding: '16px 32px', fontSize: 18 },

    cursor: disabled ? 'not-allowed' : 'pointer',
    borderRadius: 'var(--radius-control)',
    transition: 'all 250ms var(--ease-hud)',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    opacity: disabled ? 0.4 : 1,
    ...sizes[size],
  };
  const variants = {
    primary: {
      background: 'var(--nebula-cyan)', color: 'var(--space-black)', border: 'none',
      boxShadow: h ? 'var(--glow-cyan-strong)' : 'none',

    secondary: {

      border: '0.8px solid ' + (h ? 'var(--nebula-cyan-60)' : 'var(--nebula-cyan-50)'),

      backdropFilter: 'var(--glass-blur)', WebkitBackdropFilter: 'var(--glass-blur)',
      color: 'var(--text-primary)',

      boxShadow: (h ? 'var(--glow-cyan-soft), ' : '') + 'var(--glass-highlight)',
      transform: h ? 'translateY(-2px)' : 'translateY(0)',

  };
  return (
    <button disabled={disabled} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ ...base, ...variants[variant], ...style }} {...rest}>{children}</button>

}

// ---- components/brand/StarField.jsx ----

/* Deterministic scattered star-points. Parent must be position:relative. */
function StarField({ count = 24, seed = 7, opacity = 0.35, style }) {
  const stars = React.useMemo(() => {
    let s = seed;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    return Array.from({ length: count }, (_, i) => ({
      id: i, x: rnd() * 100, y: rnd() * 100,
      r: 0.75 + rnd() * 1.25, o: 0.4 + rnd() * 0.6,
    }));
  }, [count, seed]);
  return (
    <svg aria-hidden="true" width="100%" height="100%" preserveAspectRatio="none"
      style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity, ...style }}>
      {stars.map((st) => (
        <circle key={st.id} cx={st.x + '%'} cy={st.y + '%'} r={st.r} fill="#F8FAFC" opacity={st.o} />
      ))}
    </svg>
  );
}
