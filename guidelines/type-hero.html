<!-- @dsCard group="Type" viewport="700x210" subtitle="Weight 700, ~80px, shimmer gradient — one per page" name="Hero headline" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;flex-direction:column;justify-content:center;height:100%;gap:12px;">
  <div class="shimmer-text" style="font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-0.01em;">Ctech International</div>
  <div style="font-size:12px;color:var(--text-secondary);">.shimmer-text · var(--shimmer-gradient) clipped to text, animated. Reserve for the single biggest headline — it loses impact if overused.</div>
</div></body></html>
