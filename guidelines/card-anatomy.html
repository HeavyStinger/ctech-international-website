<!-- @dsCard group="Brand" viewport="700x190" subtitle="Liquid glass — frosted blur over the void" name="Card anatomy" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;gap:24px;">
  <div style="flex:1;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:12px;padding:20px;box-shadow:var(--glass-highlight);">
    <div style="font-size:18px;font-weight:600;">Web App Development</div>
    <div style="font-size:14px;color:var(--text-secondary);line-height:1.6;margin-top:6px;">Custom applications built on modern frameworks.</div>
  </div>
  <div style="flex:1;background:var(--glass-bg-hover);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--nebula-cyan-30);border-radius:12px;padding:20px;box-shadow:var(--glow-cyan-soft), var(--glass-highlight);">
    <div style="font-size:18px;font-weight:600;">Hover state</div>
    <div style="font-size:14px;color:var(--text-secondary);line-height:1.6;margin-top:6px;">Glass brightens, border warms toward cyan, soft glow.</div>
  </div>
</div>
<div style="font-size:12px;color:var(--text-secondary);margin-top:12px;">--glass-bg · --glass-blur · 1px --glass-border · inset highlight · 12px radius, everywhere.</div></body></html>
