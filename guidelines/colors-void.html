<!-- @dsCard group="Colors" viewport="700x170" subtitle="Backgrounds, surfaces, borders" name="Void & surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;gap:12px;">
  
  <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">
    <div style="height:64px;border-radius:6px;background:var(--space-black);border:1px solid var(--space-border);"></div>
    <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;">Page background #05080F<br><span style="color:var(--text-primary);font-weight:500;">--space-black</span></div>
  </div>
  
  <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">
    <div style="height:64px;border-radius:6px;background:var(--space-surface);border:1px solid var(--space-border);"></div>
    <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;">Card / panel #080C16<br><span style="color:var(--text-primary);font-weight:500;">--space-surface</span></div>
  </div>
  
  <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">
    <div style="height:64px;border-radius:6px;background:var(--space-surface-hover);border:1px solid var(--space-border);"></div>
    <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;">Hover / elevated #0D1220<br><span style="color:var(--text-primary);font-weight:500;">--space-surface-hover</span></div>
  </div>
  
  <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;">
    <div style="height:64px;border-radius:6px;background:var(--space-border);"></div>
    <div style="font-size:12px;color:var(--text-secondary);line-height:1.4;">Borders, dividers #1D283A<br><span style="color:var(--text-primary);font-weight:500;">--space-border</span></div>
  </div>
</div></body></html>
