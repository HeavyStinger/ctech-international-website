<!-- @dsCard group="Spacing" viewport="700x190" subtitle="4px base scale — lean into the void" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;align-items:flex-end;gap:16px;height:110px;">
  
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:4px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">4</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:8px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">8</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:12px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">12</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:16px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">16</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:24px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">24</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:32px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">32</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:48px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">48</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:64px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">64</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:28px;height:96px;background:var(--nebula-cyan-10);border:1px solid var(--nebula-cyan-30);border-radius:2px;"></div>
    <div style="font-size:11px;color:var(--text-secondary);">96</div>
  </div>
</div>
<div style="font-size:12px;color:var(--text-secondary);margin-top:10px;">Heroes get --space-9/--space-10 padding — generous emptiness supports the deep-space feel.</div></body></html>
