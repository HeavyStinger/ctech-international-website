<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;gap:32px;align-items:center;height:100%;">
  <div style="flex:1;">
    <div style="font-size:22px;font-weight:600;color:var(--text-primary);">Headings & primary body</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">--text-primary · #F8FAFC</div>
  </div>
  <div style="flex:1;">
    <div style="font-size:22px;font-weight:400;color:var(--text-secondary);">Muted, secondary text</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">--text-secondary · #94A3B8</div>
  </div>
</div></body></html>
