<!-- @dsCard group="Brand" viewport="700x170" subtitle="Sharp HUD controls, 12px panels, no pills" name="Shape & radius" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;gap:24px;align-items:center;">
  <div style="text-align:center;">
    <div style="width:150px;height:44px;border-radius:var(--radius-control);background:var(--nebula-cyan);display:flex;align-items:center;justify-content:center;color:var(--space-black);font-weight:600;font-size:14px;">4px</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">--radius-control · buttons</div>
  </div>
  <div style="text-align:center;">
    <div style="width:150px;height:44px;border-radius:var(--radius-input);background:var(--space-surface);border:1px solid var(--space-border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-secondary);">4px</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">--radius-input · fields</div>
  </div>
  <div style="text-align:center;">
    <div style="width:150px;height:64px;border-radius:var(--radius-card);background:var(--space-surface);border:1.6px solid var(--space-border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-secondary);">12px</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">--radius-card · all cards/panels</div>
  </div>
  <div style="text-align:center;opacity:0.45;">
    <div style="width:150px;height:44px;border-radius:999px;border:1px dashed var(--space-border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-secondary);text-decoration:line-through;">pill</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">never</div>
  </div>
</div></body></html>
