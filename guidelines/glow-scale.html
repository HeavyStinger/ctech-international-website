<!-- @dsCard group="Brand" viewport="700x200" subtitle="Glow replaces drop shadows — three intensities" name="Glow system" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="display:flex;gap:24px;padding:12px 4px;">
  <div style="flex:1;text-align:center;">
    <div style="height:72px;border-radius:12px;background:var(--space-surface);border:1px solid var(--nebula-cyan-30);box-shadow:var(--glow-cyan-soft);"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:10px;">--glow-cyan-soft<br>ambient accents</div>
  </div>
  <div style="flex:1;text-align:center;">
    <div style="height:72px;border-radius:12px;background:var(--surface-translucent);border:0.8px solid var(--nebula-cyan-50);box-shadow:var(--glow-cyan);"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:10px;">--glow-cyan<br>interactive resting state</div>
  </div>
  <div style="flex:1;text-align:center;">
    <div style="height:72px;border-radius:12px;background:var(--surface-translucent);border:0.8px solid var(--nebula-cyan-60);box-shadow:var(--glow-cyan-strong);"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:10px;">--glow-cyan-strong<br>hover / focus</div>
  </div>
</div></body></html>
