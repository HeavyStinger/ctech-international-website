<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-sans);color:var(--text-primary);}
  body{padding:20px;box-sizing:border-box;}
  *{box-sizing:border-box;}
</style></head><body>
<div style="position:relative;height:130px;border-radius:12px;border:1px solid var(--space-border);overflow:hidden;background:var(--space-black);">
  <svg width="100%" height="100%" viewBox="0 0 660 130" preserveAspectRatio="none" style="position:absolute;inset:0;">
    <polyline points="60,90 180,40 320,70 470,25 610,60" fill="none" stroke="#00CCFF" stroke-width="1" opacity="0.10"/>
    <g fill="#F8FAFC">
      <circle cx="60" cy="90" r="1.5" opacity="0.3"/><circle cx="180" cy="40" r="2" opacity="0.35"/><circle cx="320" cy="70" r="1.5" opacity="0.25"/><circle cx="470" cy="25" r="2" opacity="0.35"/><circle cx="610" cy="60" r="1.5" opacity="0.3"/>
      <circle cx="110" cy="25" r="1" opacity="0.2"/><circle cx="250" cy="105" r="1" opacity="0.2"/><circle cx="400" cy="95" r="1" opacity="0.18"/><circle cx="540" cy="100" r="1" opacity="0.2"/><circle cx="590" cy="18" r="1" opacity="0.18"/><circle cx="30" cy="50" r="1" opacity="0.15"/>
    </g>
  </svg>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-secondary);">Decoration, not an animated starfield — low opacity, non-distracting</div>
</div></body></html>
